<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心奇学单词</title>
<style>
:root{
  --bg:#eaf4fb; --bg2:#f6fbff; --card:#ffffff;
  --primary:#5aa7e8; --primary-dark:#3b82c4; --primary-soft:#dceeff;
  --accent:#ff8f6b; --accent-dark:#f2704e;
  --text:#1f3a5f; --muted:#6b87a3;
  --border:#cfe4f5; --red:#ff5b5b; --green:#3bbf7a; --gold:#d4af37;
  --shadow:0 6px 22px rgba(90,167,232,.16);
  --radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); color:var(--text); background:
    radial-gradient(1200px 500px at 10% -10%, #dcedff 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #e0f2ff 0%, transparent 55%),
    var(--bg);
  min-height:100vh; font-size:16px; line-height:1.55;
}
button{font-family:inherit; cursor:pointer; border:none;}
input,select,textarea{font-family:inherit; font-size:16px;}
.hidden{display:none !important;}

/* ===== 顶部标题 ===== */
.app-header{
  text-align:center; padding:20px 16px 12px;
  background:linear-gradient(135deg,#5aa7e8,#7fc0f5 55%,#a4d7ff);
  color:#fff; border-bottom:4px solid #d4ecff;
}
.app-header h1{margin:0; font-size:30px; letter-spacing:2px; text-shadow:0 2px 6px rgba(0,0,0,.12);}
.app-header .sub{margin:6px 0 0; font-size:13px; opacity:.95; letter-spacing:.5px;}

/* ===== 导航 ===== */
.nav{display:flex; justify-content:center; gap:8px; padding:12px 12px 0; flex-wrap:wrap; position:sticky; top:0; z-index:30; background:linear-gradient(var(--bg) 80%,transparent);}
.nav button{
  display:flex; align-items:center; gap:6px; padding:10px 16px; min-height:44px;
  border-radius:999px; background:#fff; color:var(--primary-dark); font-size:15px; font-weight:600;
  border:2px solid var(--border); box-shadow:0 3px 10px rgba(90,167,232,.10);
  transition:.18s;
}
.nav button:hover{transform:translateY(-2px);}
.nav button.active{background:linear-gradient(135deg,#5aa7e8,#7fc0f5); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(90,167,232,.35);}
.nav button:disabled{opacity:.45; cursor:not-allowed; transform:none;}

/* ===== 页面容器 ===== */
.page{display:none; max-width:960px; margin:0 auto; padding:18px 16px 120px; animation:fade .25s;}
.page.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

.card{
  background:var(--card); border-radius:var(--radius); padding:18px;
  border:2px solid var(--border); box-shadow:var(--shadow); margin-bottom:16px;
}
.card h2{margin:0 0 12px; font-size:19px; display:flex; align-items:center; gap:8px;}
.card h2 .tag{font-size:12px; background:var(--primary-soft); color:var(--primary-dark); padding:2px 10px; border-radius:999px; font-weight:600;}
.muted{color:var(--muted); font-size:14px;}
.section-title{font-size:15px; font-weight:700; color:var(--primary-dark); margin:16px 0 8px; display:flex; align-items:center; gap:6px;}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:11px 18px; min-height:44px;
  border-radius:14px; font-size:15px; font-weight:700; border:2px solid transparent;
  background:#fff; color:var(--primary-dark); border-color:var(--border); box-shadow:0 3px 8px rgba(90,167,232,.10);
  transition:.16s;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 14px rgba(90,167,232,.22);}
.btn.primary{background:linear-gradient(135deg,#5aa7e8,#7fc0f5); color:#fff; border-color:transparent;}
.btn.accent{background:linear-gradient(135deg,#ff9a76,#ffb38a); color:#fff;}
.btn.danger{background:#fff; color:#e5484d; border-color:#ffc9cc;}
.btn.warn{background:#fff; color:#c07a00; border-color:#ffe0a3;}
.btn.small{padding:7px 12px; min-height:40px; font-size:14px; border-radius:11px;}
.btn.block{width:100%; justify-content:center;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

/* ===== 表单 ===== */
label.fld{display:block; margin-bottom:14px;}
label.fld span.lbl{display:block; font-weight:700; font-size:14px; color:var(--text); margin-bottom:6px;}
input[type=text],input[type=number],select,textarea{
  width:100%; padding:11px 12px; border-radius:12px; border:2px solid var(--border);
  background:#fbfdff; color:var(--text); outline:none; transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary); background:#fff; box-shadow:0 0 0 3px rgba(90,167,232,.15);}
textarea{resize:vertical; min-height:64px;}
input[type=checkbox],input[type=radio]{width:18px; height:18px; accent-color:#5aa7e8;}

.chip-group{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; min-height:40px;
  border-radius:999px; border:2px solid var(--border); background:#fff; cursor:pointer;
  font-size:14px; font-weight:600; color:var(--muted); user-select:none; transition:.14s;
}
.chip input{display:none;}
.w-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; border:2px solid #b9c4cf; font-size:14px; font-weight:600; color:#33415c; cursor:default;}
.w-chip .dot{flex-shrink:0;}
.w-chip .w-in{display:inline-block; width:56px; padding:4px 6px; border:1.5px solid #8fa4b8; border-radius:8px; text-align:center; font-size:15px; font-weight:700; background:#fff; color:#1f3a5f; outline:none;}
.w-chip .w-in:focus{border-color:#5aa7e8; box-shadow:0 0 0 3px rgba(90,167,232,.15);}
.chip.on{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-dark);}

/* ===== 今日复习 ===== */
.today-wrap{border:2.5px dashed #ffb38a; background:#fff8f2; border-radius:var(--radius); padding:14px 16px; margin-bottom:16px;}
.today-head{display:flex; align-items:center; gap:8px; font-weight:800; color:#d4632f;}
.today-item{display:flex; align-items:center; gap:10px; padding:9px 10px; margin-top:8px; background:#fff; border-radius:12px; border:2px solid #ffe0cf;}
.today-item.overdue{border-color:#ffb3b3; background:#fff4f4;}
.today-item .w{font-weight:800; font-size:17px;}
.today-item .m{color:var(--muted); font-size:14px; flex:1;}
.pill{font-size:11px; padding:2px 9px; border-radius:999px; font-weight:800; white-space:nowrap;}
.pill.red{background:#ffe1e1; color:#e5484d;}
.pill.yellow{background:#fff2cf; color:#b47a00;}
.pill.green{background:#e2f7ea; color:#1f9d55;}
.pill.gray{background:#eef2f6; color:#6b87a3;}

/* ===== 词汇表表格 ===== */
.wb-controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
.wb-controls input[type=text]{width:auto; flex:1; min-width:150px;}
.wb-controls select{width:auto;}
table.wb{width:100%; border-collapse:collapse; font-size:13px;}
table.wb th,table.wb td{padding:6px 7px; text-align:left; border-bottom:1px solid #eaf2fb; vertical-align:middle;}
table.wb th{color:var(--primary-dark); font-size:12px; background:#f2f9ff; white-space:nowrap;}
table.wb th.tight,table.wb td.tight{padding-left:4px; padding-right:4px;}
table.wb th.opt,table.wb td.opt{white-space:nowrap; text-align:center;}
table.wb td.opt .btn{padding:4px 9px; min-height:30px; font-size:13px;}
table.wb .act-row{display:inline-flex; gap:5px; align-items:center;}
table.wb td .acc-bar{height:7px; border-radius:4px; background:#eef3f9; overflow:hidden; min-width:56px;}
table.wb td .acc-bar i{display:block; height:100%; border-radius:4px;}
.dot{display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.08);}
.band-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--muted); margin-top:8px;}

/* ===== 练习页 ===== */
.prac-progress{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.prac-progress .bar{flex:1; height:10px; border-radius:6px; background:#e5f0fb; overflow:hidden;}
.prac-progress .bar i{display:block; height:100%; background:linear-gradient(90deg,#5aa7e8,#7fc0f5); border-radius:6px; transition:.3s;}
.prac-card{background:#fff; border:2px solid var(--border); border-radius:22px; padding:26px 20px; text-align:center; box-shadow:var(--shadow);}
.prac-card .src{font-size:13px; color:var(--muted); margin-bottom:6px;}
.prac-card .w{font-size:46px; font-weight:800; letter-spacing:1px; margin:6px 0;}
.prac-card .ph{font-size:20px; color:var(--muted); margin-bottom:10px;}
.prac-card .me{font-size:22px; font-weight:700; color:var(--primary-dark); margin-bottom:12px;}
.prac-extra{display:none; text-align:left; background:#f6fbff; border:2px dashed var(--border); border-radius:14px; padding:14px; margin-top:14px;}
.prac-extra.show{display:block;}
.prac-extra .line{margin:8px 0; font-size:15px;}
.prac-extra .k{font-weight:800; color:var(--primary-dark);}
.prac-nav{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap;}

/* ===== 测评页 ===== */
.quiz-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.quiz-top .count{font-weight:800; font-size:16px;}
.quiz-mode-tag{font-size:12px; padding:3px 10px; border-radius:999px; background:var(--primary-soft); color:var(--primary-dark); font-weight:700;}
.deck-status{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; justify-content:center;}
.deck-status .ds{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; border:2px solid var(--border); background:#fff; color:var(--muted); transition:.2s;}
.deck-status .ds.done{background:#e2f7ea; border-color:#9fdcb7; color:#1f9d55;}
.deck-status .ds.cur{background:linear-gradient(135deg,#5aa7e8,#7fc0f5); color:#fff; border-color:transparent; transform:scale(1.15);}

.flip-scene{perspective:1400px; width:100%; max-width:360px; margin:0 auto;}
.flipper{position:relative; width:100%; aspect-ratio:3/4; transition:transform .6s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; cursor:pointer;}
.flipper.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; border-radius:24px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; box-shadow:0 14px 34px rgba(31,58,95,.25);}
.face.back{background:#1f3a5f;}
.face.front{background:#fff; border:3px solid var(--border); transform:rotateY(180deg); display:flex; flex-direction:column;}

.front-top{background:linear-gradient(135deg,#fff,#f2f9ff); padding:16px; border-bottom:2px dashed var(--border); position:relative; min-height:96px; display:flex; align-items:center; justify-content:center;}
.front-top .cn{font-size:34px; font-weight:800;}
.front-mid{padding:20px 16px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative;}
.front-mid .en{font-size:34px; font-weight:800; letter-spacing:.5px;}
.front-mid .ph{font-size:18px; color:var(--muted);}
.front-mid .speak{font-size:14px; color:var(--primary-dark); cursor:pointer; margin-top:6px; display:inline-flex; gap:4px; align-items:center;}
.front-judge{border-top:2px dashed var(--border); padding:14px; background:#fbfdff; border-radius:0 0 24px 24px;}

.fog{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:opacity .4s;}
.fog.big{background:rgba(120,140,160,.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);}
.fog .fog-txt{color:#fff; font-weight:800; font-size:15px; background:rgba(0,0,0,.25); padding:6px 14px; border-radius:999px; letter-spacing:1px;}
.fog.cleared{opacity:0; pointer-events:none;}

.judge-btns{display:flex; gap:12px; justify-content:center; align-items:center;}
.judge-btns .jb{flex:1; max-width:150px; min-height:56px; border-radius:16px; font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:6px; transition:.15s;}
.jb.yes{background:#e7f8ee; color:#1f9d55; border:2px solid #9fdcb7;}
.jb.no{background:#ffecec; color:#e5484d; border:2px solid #ffb3b3;}
.jb:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.10);}
.jb:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.judge-hint{font-size:13px; color:var(--muted); text-align:center; margin-top:2px;}

/* ===== 玫瑰图 ===== */
.rose-wrap{display:flex; flex-direction:column; gap:10px; align-items:center;}
.rose-wrap svg{max-width:100%; height:auto;}
.rose-legend{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; font-size:13px;}
.rose-legend .lg{display:flex; align-items:center; gap:4px; color:var(--muted);}
.rose-legend .sw{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.08);}

/* ===== 范围勾选行 & 悬停提示 ===== */
.range-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.range-g{font-weight:700; color:var(--text); min-width:56px; font-size:14px;}
.rose-tip{position:fixed; z-index:300; background:#1f3a5f; color:#fff; padding:6px 12px; border-radius:8px; font-size:13px; pointer-events:none; display:none; box-shadow:0 4px 12px rgba(0,0,0,.22); max-width:260px;}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed; inset:0; background:rgba(31,58,95,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; animation:fade .2s;}
.modal{
  background:#fff; border-radius:22px; border:4px solid #a4d7ff; box-shadow:0 20px 60px rgba(31,58,95,.4);
  width:100%; max-width:480px; max-height:86vh; overflow:auto; padding:22px; position:relative;
}
.modal h3{margin:0 0 14px; font-size:20px; display:flex; align-items:center; gap:8px;}
.modal .close{position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; background:#f0f6fd; color:var(--muted); font-size:18px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
.result-hero{text-align:center; padding:6px 0 14px;}
.result-hero .big{font-size:52px; font-weight:800; color:var(--primary-dark);}
.result-hero .label{color:var(--muted); font-size:14px;}
.result-hero .enc{font-size:22px; font-weight:800; margin-top:8px; color:var(--accent-dark);}
.result-hero .enc-en{font-size:15px; color:var(--muted); margin-top:2px;}

/* ===== 提示条 ===== */
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#1f3a5f; color:#fff; padding:12px 20px; border-radius:14px; font-size:14px; opacity:0; transition:.3s; z-index:200; pointer-events:none; max-width:90%; text-align:center;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.backup-tip{background:#fffbe8; border:2px solid #ffe0a3; border-radius:14px; padding:11px 14px; font-size:14px; color:#8a6200; margin-bottom:14px; display:flex; align-items:center; gap:8px;}

/* ===== 底部导航（移动端） ===== */
.bottom-nav{display:none; position:fixed; bottom:0; left:0; right:0; z-index:40; background:#fff; border-top:2px solid var(--border); padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
.bottom-nav .bn{display:flex; justify-content:space-around;}
.bottom-nav button{background:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--muted); min-height:50px; padding:4px 6px; border-radius:10px; font-weight:600;}
.bottom-nav button .ic{font-size:20px;}
.bottom-nav button.active{color:var(--primary-dark); background:var(--primary-soft);}
.bottom-nav button:disabled{opacity:.4;}

/* ===== 响应式 ===== */
@media (max-width:768px){
  .nav{display:none;}
  .bottom-nav{display:block;}
  .app-header h1{font-size:24px;}
  .prac-card .w{font-size:36px;}
  table.wb{font-size:12px;}
  table.wb th,table.wb td{padding:5px 4px;}
}
@media (min-width:769px){
  .bottom-nav{display:none;}
}
</style>
</head>

let _id=0;
function buildWords(){
  return VOCAB.map(v=>({
    id:'v'+(++_id),
    word:v[0], phonetic:v[1], meaning:v[2],
    sentence:v[3]||'', memory:v[4]||'',
    grade:v[5], semester:v[6], unit:v[7], level:v[8],
    draw:0, correct:0
  }));
}

/* ---------- 默认设置 ---------- */
function defaultRange(){ return {3:[1,2],4:[1,2],5:[1,2],6:[1,2]}; }
const DEFAULT_WEIGHT = {F:5,E:10,D:5,C:3,B:2,A:1};
function defaultSettings(){
  return {
    name:'Sophia',
    grade:3,
    encourage:JSON.parse(JSON.stringify(DEFAULT_ENCOURAGE)),
    practice:{range:defaultRange(), levels:[1,2,3], display:{word:true,phonetic:true,meaning:true,sentence:true,memory:true}, ratio:'proportional', count:10, weight:Object.assign({},DEFAULT_WEIGHT)},
    assessment:{range:defaultRange(), levels:[1,2,3], ratio:'count', count:10, mode:'mixed', weight:Object.assign({},DEFAULT_WEIGHT)},
    stats:{grades:[3,4,5,6]}
  };
}
function normalizeSettings(s){
  const def = defaultSettings();
  s = s || {};
  function rangeOf(v){
    // 新结构：{3:[1,2],4:[1,2],...}
    if(v && v.range && typeof v.range==='object' && !Array.isArray(v.range)) return v.range;
    // 旧结构：grades 数组
    const g = (v && Array.isArray(v.grades)) ? v.grades : GRADES;
    const r = {};
    g.forEach(x=>{ if(GRADES.includes(x)) r[x]=[1,2]; });
    return r;
  }
  function levelsOf(v){
    return (v && Array.isArray(v.levels)) ? v.levels.filter(l=>LEVEL[l]) : [1,2,3];
  }
  function weightOf(v){
    // 兼容旧版：顶层 s.weight 作为两者默认值
    const legacy = s.weight || {};
    return Object.assign({}, DEFAULT_WEIGHT, legacy, (v && v.weight)||{});
  }
  const p = s.practice || {}, a = s.assessment || {}, st = s.stats || {};
  return {
    name: (s.name && s.name.trim()) ? s.name : def.name,
    grade: GRADES.includes(s.grade) ? s.grade : 3,
    encourage: Object.assign({}, def.encourage, s.encourage||{}),
    practice: {
      range: rangeOf(p),
      levels: levelsOf(p),
      display: Object.assign({}, def.practice.display, p.display||{}),
      ratio: p.ratio==='proportional' ? 'proportional' : 'all',
      count: Math.max(1, parseInt(p.count)||10),
      weight: weightOf(p)
    },
    assessment: {
      range: rangeOf(a),
      levels: levelsOf(a),
      ratio: a.ratio==='all' ? 'all' : 'count',
      count: Math.max(1, parseInt(a.count)||10),
      mode: (a.mode==='c2e'||a.mode==='e2c') ? a.mode : 'mixed',
      weight: weightOf(a)
    },
    stats: {
      grades: (Array.isArray(st.grades)) ? st.grades.filter(g=>GRADES.includes(g)) : [3,4,5,6]
    }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.words)){
        // 词库版本变化时，用新词库替换（保留设置，测评记录随旧词库作废）
        const words = (d.vocabVersion === VOCAB_VERSION) ? d.words : buildWords();
        return {version:APP_VERSION, vocabVersion:VOCAB_VERSION, settings:normalizeSettings(d.settings), words};
      }
    }
  }catch(e){}
  return {version:APP_VERSION, vocabVersion:VOCAB_VERSION, settings:defaultSettings(), words:buildWords()};
}
function saveState(){
  if(!state.vocabVersion) state.vocabVersion = VOCAB_VERSION;
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function accOf(w){ return w.draw>0 ? (w.correct/w.draw) : null; }
function bandOf(w){
  if(w.draw===0) return 'F';
  const a=w.correct/w.draw;
  if(a<=0.2) return 'E';
  if(a<=0.4) return 'D';
  if(a<=0.8) return 'C';
  if(a<=0.95) return 'B';
  return 'A';
}
function weightOf(w, weights){ return (weights[bandOf(w)])||1; }
function bandColor(b){ return BAND[b].color; }
function accText(w){ return w.draw>0 ? Math.round(w.correct/w.draw*100)+'%' : '—'; }

function filterWords(range,levels){
  return state.words.filter(w=>{
    const sems = range[w.grade];
    return sems && sems.includes(w.semester) && levels.includes(w.level);
  });
}
function textbookOrder(a,b){
  if(a.grade!==b.grade) return a.grade-b.grade;
  if(a.semester!==b.semester) return a.semester-b.semester;
  if((a.unit||0)!==(b.unit||0)) return (a.unit||0)-(b.unit||0);
  return 0;
}
function levelPill(l){
  const cls = l===1?'green':l===2?'yellow':'gray';
  return '<span class="pill '+cls+'">'+LEVEL[l]+'</span>';
}
const UNIT_APPENDIX = {90:'专有名词',91:'星期',92:'数字',93:'月份',94:'基数词',95:'序数词'};
function unitLabel(u){
  if(u==null || u==='') return '—';
  if(u>=90) return UNIT_APPENDIX[u] || '附录';
  return 'U'+u;
}
function baseWord(w){
  // 去除括号注释与句末标点，用于语音朗读
  return String(w.word||w).split('(')[0].replace(/[.!?]+$/,'').trim();
}
function weightedSample(pool,n,weightFn){
  const items=pool.slice(), res=[];
  while(res.length<n && items.length){
    const ws=items.map(weightFn);
    const total=ws.reduce((a,b)=>a+b,0);
    if(total<=0){ res.push(items.splice(Math.floor(Math.random()*items.length),1)[0]); continue; }
    let r=Math.random()*total, idx=0;
    for(let i=0;i<items.length;i++){ r-=ws[i]; if(r<=0){idx=i;break;} idx=i; }
    res.push(items.splice(idx,1)[0]);
  }
  return res;
}
function tenDigitStamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes());
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

  if(g) list=list.filter(w=>w.grade===g);
  if(sm) list=list.filter(w=>w.semester===sm);

  if(list.length===0){ $('#wbTableWrap').innerHTML='<div class="muted" style="text-align:center;padding:20px;">没有符合条件的单词</div>'; return; }

/* 导出当前筛选（年级-上/下册）词汇表为 A4 打印清单（不含造句与联想记忆） */

  const sm=parseInt($('#wbSem')?$('#wbSem').value:'0');
  let list=state.words.slice();
  if(q) list=list.filter(w=>w.word.toLowerCase().includes(q)||w.meaning.includes(q));
  if(g) list=list.filter(w=>w.grade===g);
  if(sm) list=list.filter(w=>w.semester===sm);
  list.sort(textbookOrder);
  if(list.length===0){ toast('当前筛选范围内没有可导出的词汇'); return; }

  const gLabel = g ? (g+'年级') : '全部年级';
  const smLabel = sm ? SEM[sm] : '上/下册';
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const dateStr = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());

  const items = list.map(w=>{
    const lv = w.level===1?'核心':w.level===2?'二级':'一般';
    const lvCls = w.level===1?'lv1':w.level===2?'lv2':'lv3';
    return '<div class="witem '+lvCls+'">'

      +'<span class="cn">'+esc(w.meaning)+'</span>'
      +'<span class="lv">'+lv+'</span>'

  }).join('');

  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">'
    +'<title>词汇表 - '+gLabel+smLabel+'</title>'
    +'<style>'
    +'@page{size:A4;margin:12mm;}'
    +'*{box-sizing:border-box;}'
    +'body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:#1f3a5f;margin:0;background:#fff;}'
    +'.doc-head{text-align:center;margin-bottom:6px;}'
    +'.doc-head h1{font-size:18px;margin:0 0 2px;letter-spacing:1px;}'
    +'.doc-head .meta{font-size:12px;color:#6b87a3;}'
    +'.list{column-count:2;column-gap:18px;margin-top:4px;}'
    +'.witem{break-inside:avoid;display:flex;align-items:baseline;gap:5px;padding:2px 0;border-bottom:1px dotted #dbe7f3;font-size:12.5px;line-height:1.3;}'
    +'.witem .en{font-weight:800;}'
    +'.witem .ph{color:#6b87a3;font-size:11px;}'
    +'.witem .cn{flex:1 1 auto;}'
    +'.witem .lv{font-size:9px;color:#fff;border-radius:4px;padding:0 5px;white-space:nowrap;}'
    +'.witem.lv1 .lv{background:#3bbf7a;}'
    +'.witem.lv2 .lv{background:#d4a017;}'
    +'.witem.lv3 .lv{background:#9aa7b5;}'
    +'.doc-foot{margin-top:8px;font-size:10px;color:#9aa7b5;text-align:center;}'
    +'.toolbar{position:fixed;top:8px;right:8px;z-index:9;}'
    +'.toolbar button{font-size:13px;padding:6px 14px;border-radius:8px;border:none;background:#5aa7e8;color:#fff;cursor:pointer;}'
    +'@media print{.toolbar{display:none;}}'
    +'</style></head><body>'
    +'<div class="toolbar"><button onclick="window.print()">🖨️ 打印 / 另存为 PDF</button></div>'
    +'<div class="doc-head"><h1>心奇学单词 · 词汇复习清单</h1>'
    +'<div class="meta">'+gLabel+' · '+smLabel+' · 共 '+list.length+' 词 · 导出日期 '+dateStr+'</div></div>'
    +'<div class="list">'+items+'</div>'

/* ============================================================
   统计分析图：堆积扇形图（玫瑰图 / SVG 内联手写）
   每个年级一个扇区，扇区内分上/下册，再按掌握程度 A–F 堆积
   ============================================================ */
let roseTip=null;
function renderRoseChart(sel, grades, mini){
  const el=$(sel); if(!el) return;
  const G = grades.filter(g=>GRADES.includes(g));
  if(G.length===0){ el.innerHTML='<div class="muted" style="text-align:center;padding:20px;">请先勾选年级</div>'; return; }
  const size = mini?320:480;
  const cx=size/2, cy=size/2;
  const r0 = mini? size*0.15 : size*0.16;   // 内孔
  const r1 = size/2 - 34;                    // 外径
  const angGrade = 2*Math.PI/G.length;
  const bands=['A','B','C','D','E','F'];

  let paths='', labels='';
  G.forEach((g,gi)=>{
    [1,2].forEach(sem=>{
      const ws = state.words.filter(w=>w.grade===g && w.semester===sem);
      const total = ws.length;
      const a0 = gi*angGrade + (sem===1?0:angGrade/2) - Math.PI/2;
      const a1 = a0 + angGrade/2;
      if(total===0){
        paths += '<path d="'+polarSector(cx,cy,r0,r1,a0,a1)+'" fill="#eef3f9" stroke="#fff" stroke-width="1.5"/>';
      } else {
        let acc=0;
        bands.forEach(b=>{
          const cnt = ws.filter(w=>bandOf(w)===b).length;
          if(cnt<=0) return;
          const frac = cnt/total;
          const ba0 = a0 + (a1-a0)*acc;
          const ba1 = a0 + (a1-a0)*(acc+frac);
          acc += frac;
          const tip = g+'年级'+SEM[sem]+' · '+BAND[b].label+'：'+cnt+'/'+total+' 词';
          paths += '<path d="'+polarSector(cx,cy,r0,r1,ba0,ba1)+'" fill="'+BAND[b].color+'" stroke="#fff" stroke-width="1.2" data-tip="'+esc(tip)+'"/>';
        });
      }
    });
    // 年级标签（放扇区中部偏外）
    const mid = gi*angGrade - Math.PI/2 + angGrade/2;
    const lr = r1 + 14;
    labels += '<text x="'+(cx+lr*Math.cos(mid))+'" y="'+(cy+lr*Math.sin(mid))+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1f3a5f">'+g+'年级</text>';
  });

  const center = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r0+'" fill="#fff" stroke="#cfe4f5" stroke-width="1.5"/>'
    +'<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1f3a5f">掌握程度</text>'
    +'<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="11" fill="#6b87a3">堆积扇形图</text>';

  el.innerHTML = '<svg viewBox="0 0 '+size+' '+size+'" style="max-width:100%;height:auto;width:100%;">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r1+3)+'" fill="#fff" stroke="#cfe4f5" stroke-width="2"/>'
    + paths + labels + center + '</svg>';

  // 悬停数值提示
  el.querySelectorAll('path[data-tip]').forEach(p=>{
    p.addEventListener('mousemove', e=>showRoseTip(e, p.getAttribute('data-tip')));
    p.addEventListener('mouseleave', hideRoseTip);
  });
}
function showRoseTip(e, txt){
  if(!roseTip){
    roseTip=document.createElement('div');
    roseTip.className='rose-tip';
    document.body.appendChild(roseTip);
  }
  roseTip.textContent=txt;
  roseTip.style.display='block';
  roseTip.style.left=(e.clientX+14)+'px';
  roseTip.style.top=(e.clientY+14)+'px';
}
function hideRoseTip(){ if(roseTip) roseTip.style.display='none'; }
function polarSector(cx,cy,r0,r1,a0,a1){
  const large = (a1-a0)>Math.PI?1:0;
  const x0=cx+r0*Math.cos(a0), y0=cy+r0*Math.sin(a0);
  const x1=cx+r0*Math.cos(a1), y1=cy+r0*Math.sin(a1);
  const x2=cx+r1*Math.cos(a1), y2=cy+r1*Math.sin(a1);
  const x3=cx+r1*Math.cos(a0), y3=cy+r1*Math.sin(a0);
  return 'M '+x0+' '+y0
    +' L '+x3+' '+y3
    +' A '+r1+' '+r1+' 0 '+large+' 1 '+x2+' '+y2
    +' L '+x1+' '+y1
    +' A '+r0+' '+r0+' 0 '+large+' 0 '+x0+' '+y0
    +' Z';
}

function startPractice(idsOverride){

  if(pool.length===0){ toast('范围内没有单词，请到设置页调整'); return; }
  pool.sort(textbookOrder);
  let list=pool;
  if(!idsOverride && s.practice.ratio==='proportional'){
    list=weightedSample(pool, Math.min(s.practice.count, pool.length), w=>weightOf(w, s.practice.weight));
    list.sort(textbookOrder);
  }
  session={type:'practice', list, idx:0};
  setNavLocked(true);
  showPage('practice');
}

  let pool=filterWords(s.range, s.levels);

  let selected;
  if(s.ratio==='all'){ selected=pool.slice(); }
  else { selected=weightedSample(pool, Math.min(s.count, pool.length), w=>weightOf(w, s.weight)); }
  selected=shuffle(selected);
  const qs=selected.map((w,i)=>{
    let mode=s.mode;
    if(mode==='mixed') mode = Math.random()<0.5?'c2e':'e2c';
    return {id:w.id, mode, num:i+1};
  });
  session={type:'assessment', qs, idx:0, results:[]};
  setNavLocked(true);
  showPage('assessment');
}

function flipCard(){
  if(session._flipped) return;
  session._flipped=true;
  $('#flipper').classList.add('flipped');

function revealJudge(){
  if(!session._flipped || session._revealed) return;
  session._revealed=true;
  const q=session.qs[session.idx];
  // 揭开灰雾
  if(q.mode==='c2e'){ const f=$('#fogEn'); if(f) f.classList.add('cleared'); }
  else { const f=$('#fogCn'); if(f) f.classList.add('cleared'); }
  $('#judgeZone').innerHTML = `
    <div class="judge-btns">
      <button class="jb yes" onclick="judge(true)">✔ 答对</button>
      <button class="jb no" onclick="judge(false)">✘ 答错</button>
    </div>
  `;
}

function judge(correct){
  if(!session || session._judged) return;
  session._judged=true;
  session.results.push({id:session.qs[session.idx].id, correct});
  const btns=$$('#judgeZone .jb');
  btns.forEach(b=>b.disabled=true);
  // 视觉反馈
  setTimeout(()=>{
    if(session.idx < session.qs.length-1){
      session.idx++; session._judged=false;
      renderAssessmentCard();
    } else {
      finishAssessment();
    }
  }, 550);
}

function finishAssessment(){
  const total=session.qs.length;
  const correct=session.results.filter(r=>r.correct).length;
  const acc=total>0?correct/total:0;
  const score=Math.round(acc*100);
  // 写入题库
  session.results.forEach(r=>{
    const w=state.words.find(x=>x.id===r.id);
    if(w){ w.draw++; if(r.correct) w.correct++; }
  });
  saveState();
  const band = acc>=0.95?'A':acc>=0.8?'B':acc>=0.4?'C':acc>=0.2?'D':acc>0?'E':'F';
  const enc=state.settings.encourage[band];
  session=null; setNavLocked(false);

  openModal(`
    <h3>🎯 测评完成</h3>
    <div class="result-hero">
      <div class="big">${score}<span style="font-size:24px;">分</span></div>
      <div class="label">答对 ${correct} / ${total} 题 · 正确率 ${Math.round(acc*100)}%</div>
      <div class="enc">${esc(enc.zh)}</div>
      <div class="enc-en">${esc(enc.en)}</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal();goHome()">回到主界面</button>
      <button class="btn primary" onclick="closeModal();goAssessment()">🔄 再来一轮</button>
    </div>
  `);
}

function importData(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        doImport(d);
      }catch(e){ toast('文件解析失败，请确认是导出的 JSON 备份'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
let pendingImport=null;
function doImport(d){
  if(!d || typeof d!=='object'){ toast('无效的备份文件'); return; }
  const hasWords = Array.isArray(d.words);
  const hasSettings = !!(d.settings && typeof d.settings==='object');
  if(!hasWords && !hasSettings){ toast('无效的备份文件（需包含设置参数或教材词库）'); return; }
  pendingImport=d;
  const parts=[];
  if(hasSettings) parts.push('设置参数');
  if(hasWords) parts.push('教材词库');
  const scope = parts.join('与');
  const wordNote = hasWords ? ('当前 '+state.words.length+' 词 → '+d.words.length+' 词。') : '';
  const msg = '继续导入将<b>覆盖</b>当前'+scope+'。'+wordNote;
  if(d.version && d.version!==APP_VERSION){
    openModal(`
      <h3>⚠️ 版本不一致</h3>
      <p>备份版本为 <b>${esc(d.version||'未知')}</b>，当前版本为 <b>${APP_VERSION}</b>。</p>
      <p>${msg}是否继续？</p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn warn" onclick="applyPendingImport()">确认继续</button>
      </div>
    `);
  } else {
    openModal(`
      <h3>导入确认</h3>
      <p>${msg}是否继续？</p>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn warn" onclick="applyPendingImport()">确认继续</button>
      </div>
    `);
  }
}
function applyPendingImport(){
  if(!pendingImport) return;
  const d=pendingImport; pendingImport=null;
  if(Array.isArray(d.words)) state.words=d.words;
  if(d.settings && typeof d.settings==='object') state.settings=normalizeSettings(d.settings);
  state.version=APP_VERSION;
  saveState(); closeModal(); renderHome(); toast('导入成功');
}
